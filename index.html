<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сюрприз</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --blush: #f6d9dd;
    --rose: #e8a5b0;
    --wine: #7a2e3a;
    --cream: #fff6f2;
    --gold: #d8a765;
    --paper: #fbf1e6;
  }
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Cormorant Garamond', serif;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: calc(40px + env(safe-area-inset-top, 0px)) 18px calc(40px + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(135deg, #fdeef0, #f6d9dd 35%, #eab8c2 65%, #f3d6c8 100%);
    background-attachment: fixed;
    background-size: 300% 300%;
    animation: drift 18s ease-in-out infinite;
  }
  @keyframes drift {
    0%,100% { background-position: 0% 30%; }
    50%     { background-position: 100% 70%; }
  }

  .sparks { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: var(--gold); opacity: 0;
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.4); }
    50%     { opacity: 0.9; transform: scale(1.3); }
  }

  .petals { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .petal {
    position: absolute; top: -40px; font-size: 18px; color: var(--rose); opacity: 0.75;
    animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite;
    will-change: transform;
  }
  .petal.gold { color: var(--gold); }
  .petal.wine { color: var(--wine); opacity: 0.5; }
  @keyframes fall {
    0%   { transform: translateY(-5vh) translateX(0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(360deg); opacity: 0; }
  }

  main { position: relative; z-index: 2; width: 100%; max-width: 640px; text-align: center; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.7s ease; }
  .screen.leaving { position: absolute; inset: 0; display: block; animation: fadeOut 0.45s ease forwards; pointer-events: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-18px); } }

  .envelope-wrap { display: inline-block; padding: 20px; background: none; border: none; }
  .envelope-emoji {
    font-size: clamp(64px, 18vw, 96px);
    display: inline-block;
    animation: floatEmoji 3s ease-in-out infinite;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
  @keyframes floatEmoji { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-10px) rotate(3deg); } }
  .envelope-emoji.opening { transform: scale(1.6) rotate(8deg); opacity: 0; }


  .reveal-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(32px, 7vw, 48px); color: var(--wine); margin: 0 0 10px;
  }
  .reveal-sub { font-size: clamp(18px, 2.6vw, 22px); color: #5a2430; max-width: 420px; margin: 0 auto 30px; line-height: 1.5; }
  .btn {
    background: var(--wine); color: var(--cream); border: none;
    font-family: 'Cormorant Garamond', serif; font-size: 19px; font-style: italic;
    padding: 12px 30px; border-radius: 999px; cursor: pointer;
    transition: transform 0.2s ease; box-shadow: 0 10px 24px rgba(122,46,58,0.22);
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:focus-visible { outline: 2px solid var(--wine); outline-offset: 3px; }

  .map-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(26px, 5.5vw, 36px); color: var(--wine); margin: 0 0 14px;
  }

  .map-card {
    background: var(--paper);
    border: 2px solid rgba(122,46,58,0.18);
    border-radius: 18px;
    padding: 8px;
    box-shadow: 0 16px 34px rgba(122,46,58,0.18);
  }
  #leafletMap {
    width: 100%;
    height: min(58vh, 440px);
    border-radius: 12px;
  }
  .leaflet-popup-content-wrapper { border-radius: 12px; font-family: 'Cormorant Garamond', serif; }
  .leaflet-popup-content { margin: 12px 14px; text-align: center; }
  .popup-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 19px; color: var(--wine); margin: 0 0 4px; }
  .popup-desc { font-size: 15px; color: #5a2430; margin: 0 0 8px; line-height: 1.3; }
  .popup-btn {
    background: var(--wine); color: var(--cream); border: none;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 15px;
    padding: 6px 16px; border-radius: 999px; cursor: pointer;
  }

  .custom-row {
    display: flex; gap: 8px; margin-top: 16px; max-width: 380px; margin-left: auto; margin-right: auto;
  }
  .custom-row input {
    flex: 1; font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic;
    padding: 9px 14px; border-radius: 999px; border: 1px solid rgba(122,46,58,0.3);
    background: rgba(255,255,255,0.6); color: var(--wine); outline: none;
  }
  .custom-row input::placeholder { color: #b98a92; }
  .custom-row input:focus { border-color: var(--wine); }
  .custom-row button {
    background: none; border: 1px solid var(--wine); color: var(--wine);
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 16px;
    padding: 8px 18px; border-radius: 999px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .custom-row button:hover { background: var(--wine); color: var(--cream); }

  .detail { margin-top: 18px; min-height: 60px; }
  .detail-name { font-family: 'Playfair Display', serif; font-style: italic; font-size: 24px; color: var(--wine); margin: 0 0 4px; }
  .detail-desc { color: #5a2430; font-size: 16px; max-width: 420px; margin: 0 auto 14px; line-height: 1.4; }

  .confirm-btn {
    background: var(--wine); color: var(--cream); border: none;
    font-family: 'Cormorant Garamond', serif; font-size: 18px; font-style: italic;
    padding: 10px 26px; border-radius: 999px; cursor: pointer;
    opacity: 0; transform: scale(0.9); pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    box-shadow: 0 10px 22px rgba(122,46,58,0.2);
  }
  .confirm-btn.ready { opacity: 1; transform: scale(1); pointer-events: auto; }
  .confirm-btn:hover { transform: scale(1.04); }

  .final-title {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(30px, 6.5vw, 44px); color: var(--wine); margin: 0 0 8px;
  }
  .final-city { font-size: clamp(26px, 5.5vw, 34px); color: var(--wine); }
  .final-sub { color: #5a2430; font-size: 18px; max-width: 400px; margin: 14px auto 0; line-height: 1.5; }
  .change-link {
    display: inline-block; margin-top: 22px; color: #8a4553; font-style: italic; font-size: 15px;
    text-decoration: underline; cursor: pointer; background: none; border: none;
    font-family: 'Cormorant Garamond', serif;
  }

  @media (prefers-reduced-motion: reduce) {
    body, .envelope-emoji, .spark, .infinity, .infinity-wrap, .divider,
    .counter, .since, p.message, .love-actions { animation: none; opacity: 1; transform: none; }
  }

  /* ---- love screen ---- */
  .infinity {
    display: inline-block;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(80px, 20vw, 140px);
    line-height: 1;
    background: linear-gradient(90deg, var(--wine), var(--gold), var(--rose), var(--wine));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    cursor: pointer;
    animation: shimmer 7s linear infinite, breathe 4.5s ease-in-out infinite;
  }
  .infinity:hover { animation-play-state: paused; transform: scale(1.06); }
  .infinity:focus-visible { outline: 2px solid var(--wine); outline-offset: 8px; border-radius: 50%; }
  @keyframes shimmer { to { background-position: 300% 0; } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .infinity-wrap {
    padding: 10px 0 4px; overflow: visible;
    opacity: 0; animation: riseIn 1.1s ease forwards 0.15s, floatSlow 6s ease-in-out infinite 1.3s;
  }
  .infinity-wrap.leaving-love .infinity { animation: infinityAway 0.55s ease forwards; }
  @keyframes infinityAway { to { transform: scale(1.8); opacity: 0; filter: blur(10px); } }
  @keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .divider {
    font-size: 18px; color: var(--gold); letter-spacing: 0.35em;
    margin: 2px 0 16px; opacity: 0;
    animation: riseIn 1s ease forwards 0.5s, twinkle 3s ease-in-out infinite 1.6s;
  }

  .counter {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 12px 20px; margin: 18px auto 8px;
    opacity: 0; animation: riseIn 1.1s ease forwards 0.8s;
  }
  .unit { display: flex; flex-direction: column; align-items: center; min-width: 60px; }
  .num {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(28px, 5.5vw, 40px); color: var(--wine); line-height: 1;
  }
  .num.pop { animation: pop 0.4s ease; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  .unit-label { margin-top: 4px; font-size: clamp(11px, 1.7vw, 13px); color: #8a4553; }

  .since {
    font-size: clamp(13px, 1.9vw, 15px); color: #8a4553; margin-bottom: 22px;
    letter-spacing: 0.06em; opacity: 0; animation: riseIn 1.1s ease forwards 1.05s;
  }

  p.message {
    font-family: 'Playfair Display', serif; font-style: italic; font-weight: 400;
    font-size: clamp(20px, 2.8vw, 25px); line-height: 1.6; color: var(--wine);
    text-shadow: 0 1px 18px rgba(216,167,101,0.25);
    max-width: 420px; margin: 0 auto;
    opacity: 0; animation: riseIn 1.2s ease forwards 1.35s;
  }

  .secret {
    margin-top: 0; font-family: 'Playfair Display', serif; font-style: italic;
    font-size: clamp(19px, 2.6vw, 24px); color: var(--wine);
    max-width: 420px; margin-left: auto; margin-right: auto;
    max-height: 0; opacity: 0; overflow: hidden;
    transition: max-height 0.6s ease, opacity 0.6s ease, margin-top 0.6s ease;
  }
  .secret.open { max-height: 200px; opacity: 1; margin-top: 16px; }

  .love-actions {
    margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 14px;
    opacity: 0; animation: riseIn 1.1s ease forwards 1.7s;
  }
  .link-btn {
    background: none; border: 1px solid var(--wine); color: var(--wine);
    font-family: 'Cormorant Garamond', serif; font-size: 17px; font-style: italic;
    padding: 9px 22px; border-radius: 999px; cursor: pointer;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .link-btn:hover { background: var(--wine); color: var(--cream); }
</style>
</head>
<body>
<div class="sparks" id="sparks"></div>
<div class="petals" id="petals"></div>

<main>

  <section class="screen active" id="screen-love">
    <div class="infinity-wrap" id="infinityWrap">
      <span class="infinity" id="infinityBtn" role="button" tabindex="0" aria-label="Далі">&infin;</span>
    </div>
    <div class="divider">✧</div>

    <div class="counter">
      <div class="unit"><span class="num" id="n-months">0</span><span class="unit-label" id="l-months">місяців</span></div>
      <div class="unit"><span class="num" id="n-days">0</span><span class="unit-label" id="l-days">днів</span></div>
      <div class="unit"><span class="num" id="n-hours">0</span><span class="unit-label" id="l-hours">годин</span></div>
      <div class="unit"><span class="num" id="n-minutes">0</span><span class="unit-label" id="l-minutes">хвилин</span></div>
      <div class="unit"><span class="num" id="n-seconds">0</span><span class="unit-label" id="l-seconds">секунд</span></div>
    </div>
    <p class="since">разом з <span id="start-date"></span></p>

    <p class="message">З тобою навіть звичайні дні стають найкращими.<br>Дякую, що ти поруч.</p>

    <div class="love-actions">
      <button class="link-btn" id="secretBtn">ще трішки слів ♡</button>
      <p class="secret" id="secret">Люблю тебе. 🤍</p>
    </div>
  </section>

  <section class="screen" id="screen-envelope">
    <div class="envelope-wrap" id="envelopeWrap">
      <span class="envelope-emoji" id="envelopeEmoji">💌</span>
    </div>
  </section>

  <section class="screen" id="screen-map">
    <h2 class="map-title">Куди поїдемо?</h2>
    <div class="map-card">
      <div id="leafletMap"></div>
    </div>

    <div class="custom-row">
      <input type="text" id="customInput" placeholder="Інше місто" maxlength="40">
      <button id="customBtn">Обрати</button>
    </div>

    <div class="detail" id="detail"></div>
    <button class="confirm-btn" id="confirmBtn">Їдемо сюди</button>
  </section>

  <section class="screen" id="screen-final">
    <h1 class="final-title">Чудово</h1>
    <p class="final-city" id="finalCity"></p>
    <p class="final-sub">У неділю їдемо туди. 🤍</p>
    <button class="change-link" id="changeChoice">обрати інше місто</button>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
  // decorative sparks
  const sparkContainer = document.getElementById('sparks');
  const sparkCount = window.innerWidth < 500 ? 16 : 26;
  for (let i = 0; i < sparkCount; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.left = (Math.random() * 100) + 'vw';
    s.style.top = (Math.random() * 100) + 'vh';
    s.style.animationDuration = (2 + Math.random() * 3) + 's';
    s.style.animationDelay = (Math.random() * 5) + 's';
    sparkContainer.appendChild(s);
  }

  // decorative petals
  const petalContainer = document.getElementById('petals');
  const petalSymbols = ['♡','❀','✧'];
  const petalClasses = ['', 'gold', 'wine'];
  const petalCount = window.innerWidth < 500 ? 14 : 20;
  for (let i = 0; i < petalCount; i++) {
    const p = document.createElement('span');
    p.className = 'petal ' + petalClasses[Math.floor(Math.random() * petalClasses.length)];
    p.textContent = petalSymbols[Math.floor(Math.random() * petalSymbols.length)];
    const duration = 10 + Math.random() * 12;
    const delay = Math.random() * 14;
    const size = 12 + Math.random() * 16;
    const drift = (Math.random() * 80 - 40) + 'px';
    p.style.left = (Math.random() * 100) + 'vw';
    p.style.fontSize = size + 'px';
    p.style.animationDuration = duration + 's';
    p.style.animationDelay = delay + 's';
    p.style.setProperty('--drift', drift);
    petalContainer.appendChild(p);
  }

  function showScreen(id) {
    const current = document.querySelector('.screen.active');
    const next = document.getElementById(id);
    if (current === next) return;
    if (current) {
      current.classList.remove('active');
      current.classList.add('leaving');
      setTimeout(() => current.classList.remove('leaving'), 450);
    }
    next.classList.add('active');
    if (id === 'screen-map') setTimeout(() => map.invalidateSize(), 60);
  }

  // ---- love screen -> envelope: triggered by clicking/tapping the infinity ----
  const infinityWrap = document.getElementById('infinityWrap');
  const infinityBtn = document.getElementById('infinityBtn');
  let leavingLove = false;

  function goToGift() {
    if (leavingLove) return;
    leavingLove = true;
    requestMotionPermission();
    infinityWrap.classList.add('leaving-love');
    setTimeout(() => showScreen('screen-envelope'), 260);
  }
  infinityBtn.addEventListener('click', goToGift);
  infinityBtn.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToGift(); }
  });

  // ---- envelope: open by click/tap, or by "shaking" the mouse / phone ----
  const envEmoji = document.getElementById('envelopeEmoji');
  const envelopeScreen = document.getElementById('screen-envelope');
  let envelopeOpened = false;

  function openEnvelope() {
    if (envelopeOpened) return;
    envelopeOpened = true;
    envEmoji.classList.add('opening');
    setTimeout(() => showScreen('screen-map'), 450);
  }
  // opens only via "shake" (mouse shake on desktop, real device shake on mobile)

  function isEnvelopeActive() {
    return envelopeScreen.classList.contains('active');
  }

  // desktop: detect a fast back-and-forth "shake" of the mouse
  let mouseTrail = [];
  window.addEventListener('mousemove', (e) => {
    if (!isEnvelopeActive() || envelopeOpened) return;
    const now = performance.now();
    mouseTrail.push({ x: e.clientX, t: now });
    mouseTrail = mouseTrail.filter(p => now - p.t < 600);
    if (mouseTrail.length < 6) return;
    let dist = 0, reversals = 0, lastDx = null;
    for (let i = 1; i < mouseTrail.length; i++) {
      const dx = mouseTrail[i].x - mouseTrail[i - 1].x;
      dist += Math.abs(dx);
      if (lastDx !== null && Math.abs(dx) > 4 && Math.sign(dx) !== Math.sign(lastDx)) reversals++;
      if (Math.abs(dx) > 2) lastDx = dx;
    }
    if (dist > 900 && reversals >= 4) openEnvelope();
  });

  // mobile: detect a real shake via device motion
  let lastMotion = null, lastMotionTime = 0;
  function onDeviceMotion(e) {
    if (!isEnvelopeActive() || envelopeOpened) return;
    const acc = e.accelerationIncludingGravity || e.acceleration;
    if (!acc || acc.x === null) return;
    const now = Date.now();
    if (now - lastMotionTime < 90) return;
    const dt = now - lastMotionTime;
    lastMotionTime = now;
    const sum = (acc.x || 0) + (acc.y || 0) + (acc.z || 0);
    if (lastMotion !== null) {
      const speed = Math.abs(sum - lastMotion) / dt * 10000;
      if (speed > 800) openEnvelope();
    }
    lastMotion = sum;
  }
  let motionRequested = false;
  function requestMotionPermission() {
    if (motionRequested) return;
    motionRequested = true;
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      DeviceMotionEvent.requestPermission()
        .then(state => { if (state === 'granted') window.addEventListener('devicemotion', onDeviceMotion); })
        .catch(() => {});
    } else if (typeof DeviceMotionEvent !== 'undefined') {
      window.addEventListener('devicemotion', onDeviceMotion);
    }
  }

  // ---- love screen: secret words + live counter ----
  const secretBtn = document.getElementById('secretBtn');
  const secret = document.getElementById('secret');
  secretBtn.addEventListener('click', () => {
    const opening = !secret.classList.contains('open');
    secret.classList.toggle('open');
    secretBtn.textContent = opening ? 'сховати ♡' : 'ще трішки слів ♡';
  });

  const START = new Date('2026-01-25T02:00:00Z'); // ~04:00, 25 січня, за київським/львівським часом
  document.getElementById('start-date').textContent =
    START.toLocaleDateString('uk-UA', { day: 'numeric', month: 'long', year: 'numeric' });

  function pluralize(n, forms) {
    const abs = Math.abs(n) % 100;
    const n1 = abs % 10;
    if (abs > 10 && abs < 20) return forms[2];
    if (n1 > 1 && n1 < 5) return forms[1];
    if (n1 === 1) return forms[0];
    return forms[2];
  }
  const FORMS = {
    months:  ['місяць', 'місяці', 'місяців'],
    days:    ['день', 'дні', 'днів'],
    hours:   ['година', 'години', 'годин'],
    minutes: ['хвилина', 'хвилини', 'хвилин'],
    seconds: ['секунда', 'секунди', 'секунд']
  };
  function getDuration(start, now) {
    let months = (now.getUTCFullYear() - start.getUTCFullYear()) * 12 +
                 (now.getUTCMonth() - start.getUTCMonth());
    let cursor = new Date(start.getTime());
    cursor.setUTCMonth(cursor.getUTCMonth() + months);
    if (cursor.getTime() > now.getTime()) {
      months -= 1;
      cursor = new Date(start.getTime());
      cursor.setUTCMonth(cursor.getUTCMonth() + months);
    }
    let diffMs = now.getTime() - cursor.getTime();
    const days = Math.floor(diffMs / 86400000); diffMs -= days * 86400000;
    const hours = Math.floor(diffMs / 3600000); diffMs -= hours * 3600000;
    const minutes = Math.floor(diffMs / 60000); diffMs -= minutes * 60000;
    const seconds = Math.floor(diffMs / 1000);
    return { months, days, hours, minutes, seconds };
  }
  const els = {
    months:  { num: document.getElementById('n-months'),  label: document.getElementById('l-months') },
    days:    { num: document.getElementById('n-days'),    label: document.getElementById('l-days') },
    hours:   { num: document.getElementById('n-hours'),   label: document.getElementById('l-hours') },
    minutes: { num: document.getElementById('n-minutes'), label: document.getElementById('l-minutes') },
    seconds: { num: document.getElementById('n-seconds'), label: document.getElementById('l-seconds') }
  };
  let previousDuration = null;
  function tick() {
    const now = new Date();
    const d = getDuration(START, now);
    Object.keys(els).forEach(key => {
      const value = d[key];
      const { num, label } = els[key];
      if (previousDuration === null || previousDuration[key] !== value) {
        num.textContent = value;
        label.textContent = pluralize(value, FORMS[key]);
        num.classList.remove('pop');
        void num.offsetWidth;
        num.classList.add('pop');
      }
    });
    previousDuration = d;
  }
  tick();
  setInterval(tick, 1000);

  // ---- real map ----
  const CITIES = [
    { key: 'lviv',       name: 'Львів',           lat: 49.8397, lng: 24.0297, home: true },
    { key: 'zhovkva',    name: 'Жовква',          lat: 50.0587, lng: 23.9753, desc: 'Ринкова площа, замок і синагога — маленьке й затишне місто.' },
    { key: 'olesko',     name: 'Олесько',         lat: 49.9575, lng: 24.8935, desc: 'Замок на пагорбі серед полів, гарний краєвид навколо.' },
    { key: 'zolochiv',   name: 'Золочів',         lat: 49.8062, lng: 24.9002, desc: 'Ренесансний замок, тихі вулички поруч.' },
    { key: 'drohobych',  name: 'Дрогобич',        lat: 49.3494, lng: 23.5093, desc: 'Дерев’яні церкви зі списку ЮНЕСКО, старе соляне місто.' },
    { key: 'truskavets', name: 'Трускавець',      lat: 49.2775, lng: 23.5019, desc: 'Курортне містечко з мінеральною водою, доріжки для прогулянок.' },
    { key: 'skole',      name: 'Сколе',           lat: 49.0333, lng: 23.5333, desc: 'Гори, свіже повітря, поруч — скелі Тустані.' },
    { key: 'berezhany',  name: 'Бережани',        lat: 49.4463, lng: 24.9350, desc: 'Замок і старе місто, мало туристів.' },
    { key: 'ternopil',   name: 'Тернопіль',       lat: 49.5535, lng: 25.5948, desc: 'Набережна довкола ставу, гарний захід сонця.' },
    { key: 'frankivsk',  name: 'Івано-Франківськ', lat: 48.9226, lng: 24.7111, desc: 'Затишні вулички, найкраща кава в регіоні.' },
    { key: 'kremenets',  name: 'Кременець',       lat: 50.0989, lng: 25.7286, desc: 'Пагорби й краєвиди, називають «українською Швейцарією».' }
  ];

  const map = L.map('leafletMap', { scrollWheelZoom: false }).setView([49.6, 24.6], 8);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 18
  }).addTo(map);

  function pinIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="width:16px;height:16px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);"></div>`,
      iconSize: [16, 16],
      iconAnchor: [8, 8]
    });
  }

  let selectedName = null;
  const detail = document.getElementById('detail');
  const confirmBtn = document.getElementById('confirmBtn');
  const markers = {};

  function selectCity(c) {
    Object.values(markers).forEach(m => m.setIcon(pinIcon('#d8a765')));
    if (markers[c.key]) markers[c.key].setIcon(pinIcon('#7a2e3a'));
    selectedName = c.name;
    detail.innerHTML = `<p class="detail-name">${c.name}</p><p class="detail-desc">${c.desc || ''}</p>`;
    confirmBtn.classList.add('ready');
    document.getElementById('customInput').value = '';
  }

  CITIES.forEach(c => {
    if (c.home) {
      L.marker([c.lat, c.lng], { icon: pinIcon('#7a2e3a') }).addTo(map);
      return;
    }
    const marker = L.marker([c.lat, c.lng], { icon: pinIcon('#d8a765') }).addTo(map);
    marker.bindPopup(`<p class="popup-name">${c.name}</p><p class="popup-desc">${c.desc}</p>`);
    marker.on('click', () => selectCity(c));
    markers[c.key] = marker;
  });

  // custom city input
  const customInput = document.getElementById('customInput');
  function selectCustom() {
    const val = customInput.value.trim();
    if (!val) return;
    Object.values(markers).forEach(m => m.setIcon(pinIcon('#d8a765')));
    selectedName = val;
    detail.innerHTML = `<p class="detail-name">${val}</p>`;
    confirmBtn.classList.add('ready');
  }
  document.getElementById('customBtn').addEventListener('click', selectCustom);
  customInput.addEventListener('keydown', e => { if (e.key === 'Enter') selectCustom(); });

  confirmBtn.addEventListener('click', () => {
    if (!selectedName) return;
    document.getElementById('finalCity').textContent = selectedName;
    try { localStorage.setItem('trip-choice-name', selectedName); } catch (e) {}
    showScreen('screen-final');
  });
  document.getElementById('changeChoice').addEventListener('click', () => showScreen('screen-map'));

  try {
    const savedName = localStorage.getItem('trip-choice-name');
    if (savedName) {
      selectedName = savedName;
      document.getElementById('finalCity').textContent = savedName;
    }
  } catch (e) {}
</script>
</body>
</html>
